<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Tracker Dashboard</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <div class="container">

        <h1>My Tracker</h1>

        <button id="connectBtn">
            Connect Device
        </button>

        <!-- STATUS -->

        <div class="card">

            <h2>Status</h2>

            <p
                id="status"
                class="status">

                Disconnected

            </p>

        </div>

        <!-- BATTERY -->

        <div class="card">

            <h2>Battery</h2>

            <p class="battery">

                <span id="battery">
                    -
                </span>%

            </p>

        </div>

        <!-- MOTION -->

        <div class="card">

            <h2>Motion</h2>

            <p
                id="motion"
                class="motion">

                -

            </p>

        </div>

        <!-- ACCEL -->

        <div class="card">

            <h2>Acceleration</h2>

            <div class="grid">

                <div>

                    <span>X</span>

                    <h3 id="ax">
                        0.00
                    </h3>

                </div>

                <div>

                    <span>Y</span>

                    <h3 id="ay">
                        0.00
                    </h3>

                </div>

                <div>

                    <span>Z</span>

                    <h3 id="az">
                        0.00
                    </h3>

                </div>

            </div>

        </div>

        <!-- GYRO -->

        <div class="card">

            <h2>Gyroscope</h2>

            <div class="grid">

                <div>

                    <span>X</span>

                    <h3 id="gx">
                        0.00
                    </h3>

                </div>

                <div>

                    <span>Y</span>

                    <h3 id="gy">
                        0.00
                    </h3>

                </div>

                <div>

                    <span>Z</span>

                    <h3 id="gz">
                        0.00
                    </h3>

                </div>

            </div>

        </div>

        <!-- LED -->

        <button
            id="ledBtn"
            disabled>

            Turn ON Sound

        </button>

        <!-- LAST SEEN -->

        <div class="button-group">

            <button
                id="writeLastSeenBtn"
                class="btnn"
                disabled>

                Write Last Seen

            </button>

            <button
                id="readLastSeenBtn"
                class="btnn"
                disabled>

                Read Last Seen

            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
